<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0d0e15; color: #ffffff; font-family: sans-serif; padding: 15px; margin: 0; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { color: #00d2ff; margin: 0; }
        
        .input-section { background: #161b2c; border: 1px solid #2a3456; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .input-group { display: flex; gap: 10px; }
        .input-box { flex: 1; }
        .input-box label { display: block; font-size: 11px; color: #00d2ff; margin-bottom: 4px; font-weight: bold; }
        .input-box input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #2a3456; background: #0d0e15; color: #fff; box-sizing: border-box; }

        .section-title { font-size: 13px; color: #00ffcc; margin-bottom: 8px; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .card { background: #161b2c; border: 1px solid #2a3456; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
        .card.selected { border: 2px solid #00ffcc; background: #252e4d; }
        .pack-title { font-size: 12px; color: #e2e8f0; }
        .pack-price { font-size: 13px; font-weight: bold; color: #00ffcc; margin-top: 4px; }

        .payment-section { background: #161b2c; border: 1px solid #2a3456; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .kpay-box { background: #0d0e15; border: 1px dashed #00c6ff; border-radius: 6px; padding: 8px; text-align: center; margin-bottom: 10px; cursor: pointer; }
        
        .btn-submit { background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; border: none; border-radius: 8px; padding: 12px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>💎 MLBB Store</h2>
    </div>

    <!-- Player ID & Server ID Input Fields -->
    <div class="input-section">
        <div class="input-group">
            <div class="input-box">
                <label>Player ID</label>
                <input type="number" id="playerId" placeholder="12345678">
            </div>
            <div class="input-box">
                <label>Zone ID</label>
                <input type="number" id="zoneId" placeholder="1234">
            </div>
        </div>
    </div>

    <div class="section-title">ပက်ကေ့ဂျ် ရွေးချယ်ပါ</div>
    <div class="grid-container">
        <div class="card" onclick="selectCard(this, 'Weekly Pass', '6500')">
            <div class="pack-title">Weekly Pass</div>
            <div class="pack-price">6,500 MMK</div>
        </div>
        <div class="card" onclick="selectCard(this, 'Twilight Pass', '36000')">
            <div class="pack-title">Twilight Pass</div>
            <div class="pack-price">36,000 MMK</div>
        </div>
        <div class="card" onclick="selectCard(this, '86 Diamonds', '5600')">
            <div class="pack-title">86 Diamonds</div>
            <div class="pack-price">5,600 MMK</div>
        </div>
        <div class="card" onclick="selectCard(this, '172 Diamonds', '10600')">
            <div class="pack-title">172 Diamonds</div>
            <div class="pack-price">10,600 MMK</div>
        </div>
    </div>

    <div class="payment-section">
        <div class="kpay-box" onclick="navigator.clipboard.writeText('09773814319'); alert('KPay Copied!');">
            <div style="color:#ffd700; font-weight:bold;">09773814319</div>
            <div style="font-size:10px; color:#b0c4de;">Wanna Hein (နှိပ်၍ Copy ကူးပါ)</div>
        </div>
        <label style="font-size:11px; color:#b0c4de; display:block; margin-bottom:5px;">📸 KPay Slip တင်ပေးပါ -</label>
        <input type="file" id="slipFile" accept="image/*" style="width:100%; color:#fff;">
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitOrder()">အော်ဒါအတည်ပြုမည်</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedItemName = "";
        let selectedItemPrice = "";

        function selectCard(element, name, price) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedItemName = name;
            selectedItemPrice = price;
        }

        async function submitOrder() {
            const playerId = document.getElementById("playerId").value;
            const zoneId = document.getElementById("zoneId").value;
            const fileInput = document.getElementById("slipFile");
            const btn = document.getElementById("submitBtn");

            if (!playerId || !zoneId) return alert("Player ID နဲ့ Zone ID ဖြည့်ပေးပါ!");
            if (!selectedItemName) return alert("ပက်ကေ့ဂျ် ရွေးပေးပါ!");
            if (fileInput.files.length === 0) return alert("KPay Slip ဓာတ်ပုံ တင်ပေးပါ!");

            btn.disabled = true;
            btn.innerText = "အော်ဒါ ပို့နေပါပြီ...";

            const formData = new FormData();
            formData.append("player_id", playerId);
            formData.append("zone_id", zoneId);
            formData.append("item", selectedItemName);
            formData.append("price", selectedItemPrice);
            formData.append("slip", fileInput.files[0]);

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                formData.append("user_id", tg.initDataUnsafe.user.id);
                formData.append("username", tg.initDataUnsafe.user.username || "No Username");
            }

            try {
                // ⚠️ သားကြီးရဲ့ PythonAnywhere URL ကို ဒီမှာ အမှန်ထည့်ပါ ⚠️
                const response = await fetch("https://JockerLinn.pythonanywhere.com/submit-order", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert("အော်ဒါ အောင်မြင်စွာ တင်ပြီးပါပြီ!");
                    tg.close();
                } else {
                    alert("Error: " + (result.message || "Unknown error"));
                    btn.disabled = false;
                    btn.innerText = "အော်ဒါအတည်ပြုမည်";
                }
            } catch (error) {
                alert("ဆာဗာသို့ ပို့မရပါ! အင်တာနက် သို့မဟုတ် PythonAnywhere URL စစ်ပေးပါ။");
                btn.disabled = false;
                btn.innerText = "အော်ဒါအတည်ပြုမည်";
            }
        }
    </script>
</body>
</html>
