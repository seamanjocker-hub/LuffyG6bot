<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; margin: 0; background-color: #f4f4f9; }
        .card { background: white; border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background: #2481cc; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🛍️ Online Shop Catalog</h2>
    
    <div class="card">
        <div>
            <strong>Shirt A</strong><br>
            <span style="color: #2481cc;">15,000 MMK</span>
        </div>
        <button class="btn" onclick="buyItem('Shirt A', '15,000 MMK')">ဝယ်မည်</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        function buyItem(itemName, price) {
            const textData = itemName + " - " + price;

            // ၁။ Reply Keyboard (/start ခလုတ်) မှ ဖွင့်ထားပါက sendData သုံးမည်
            try {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.query_id) {
                    tg.sendData(textData);
                    setTimeout(() => { tg.close(); }, 300);
                    return;
                }
            } catch (e) {
                console.log(e);
            }

            // ၂။ Menu Button မှ ဖွင့်ထားပါက Direct Telegram Link ဖြင့် Bot ဆီ စာပိုမည်
            // ⚠️ သင့် Bot ရဲ့ Username ကို အောက်ပါနေရာမှာ လဲပေးပါ (ဥပမာ LuffyGear6_bot)
            const botUsername = "LuffyGear6bot"; 
            const encodedText = encodeURIComponent("Buy: " + textData);
            
            window.location.href = https://t.me/${botUsername}?start=${encodedText};
            if (tg) setTimeout(() => { tg.close(); }, 500);
        }
    </script>
</body>
</html>
