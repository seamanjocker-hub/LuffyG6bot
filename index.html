<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Diamond Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; margin: 0; background-color: #0f172a; color: #f8fafc; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 5px 0; color: #38bdf8; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .item-info strong { font-size: 16px; color: #f1f5f9; display: block; }
        .item-price { color: #38bdf8; font-weight: bold; margin-top: 4px; display: block; font-size: 14px; }
        
        .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        #checkout-section { display: none; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #cbd5e1; }
        .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
        
        .payment-box { background: #0f172a; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #38bdf8; font-size: 13px; }
        .payment-box p { margin: 4px 0; }

        .upload-box { margin-top: 15px; text-align: center; border: 2px dashed #475569; padding: 15px; border-radius: 8px; background: #0f172a; }
        input[type="file"] { display: none; }
        .file-label { background: #334155; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; display: inline-block; font-size: 13px; margin-top: 6px; }
        
        .submit-btn { background: #16a34a; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 15px; }
        .back-btn { background: #475569; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 13px; }
        #selected-file-name { margin-top: 6px; font-size: 12px; color: #94a3b8; word-break: break-all; }
        #status-msg { margin-top: 12px; font-weight: bold; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>💎 MLBB Diamond Shop</h2>
        <p style="font-size: 12px; color: #94a3b8;">Mobile Legends Diamond များ ချက်ချင်းဝယ်ယူနိုင်ပါသည်။</p>
    </div>

    <!-- Pack ရွေးရန် Section -->
    <div id="shop-section">
        <div class="card">
            <div class="item-info">
                <strong>💎 86 Diamonds</strong>
                <span class="item-price">4,500 MMK</span>
            </div>
            <button class="btn" onclick="selectItem('86 Diamonds', '4,500 MMK')">ဝယ်မည်</button>
        </div>

        <div class="card">
            <div class="item-info">
                <strong>💎 172 Diamonds</strong>
                <span class="item-price">8,800 MMK</span>
            </div>
            <button class="btn" onclick="selectItem('172 Diamonds', '8,800 MMK')">ဝယ်မည်</button>
        </div>

        <div class="card">
            <div class="item-info">
                <strong>💎 257 Diamonds</strong>
                <span class="item-price">13,000 MMK</span>
            </div>
            <button class="btn" onclick="selectItem('257 Diamonds', '13,000 MMK')">ဝယ်မည်</button>
        </div>

        <div class="card">
            <div class="item-info">
                <strong>💎 706 Diamonds</strong>
                <span class="item-price">35,000 MMK</span>
            </div>
            <button class="btn" onclick="selectItem('706 Diamonds', '35,000 MMK')">ဝယ်မည်</button>
        </div>
    </div>

    <!-- အချက်အလက် ဖြည့်ရန် Section -->
    <div id="checkout-section">
        <button class="back-btn" onclick="goBack()">⬅️ နောက်သို ပြန်သွားမည်</button>
        
        <h3 id="selected-item-title" style="margin-top:0; color: #38bdf8;">📦 အော်ဒါ အချက်အလက်</h3>
        
        <div class="input-group">
            <label for="mlbb-id">🎮 MLBB User ID:</label>
            <input type="number" id="mlbb-id" placeholder="ဥပမာ - 12345678" required>
        </div>

        <div class="input-group">
            <label for="mlbb-zone">🌐 Zone ID:</label>
            <input type="number" id="mlbb-zone" placeholder="ဥပမာ - 1234" required>
        </div>

        <div class="payment-box">
            <strong>💳 ငွေလွှရန် အကောင့်များ:</strong>
            <p>• <b>KPay / Wave:</b> <code>09123456789</code> (U Name)</p>
            <p>• <b>ကျသင့်ငွေ:</b> <span id="item-price" style="color: #38bdf8; font-weight: bold;"></span></p>
        </div>

        <div class="upload-box">
            <label style="font-weight: bold; display: block; font-size: 13px;">📸 ငွေလွှစလစ် ဓာတ်ပုံ တင်ပါ</label>
            <label for="slip-file" class="file-label">📁 ပုံရွေးရန် နှိပ်ပါ</label>
            <input type="file" id="slip-file" accept="image/*" onchange="showFileName()">
            <div id="selected-file-name">ဓာတ်ပုံ မရွေးရသေးပါ</div>
        </div>

        <button type="button" class="submit-btn" id="submit-btn" onclick="sendOrderToBot()">အတည်ပြု၍ အော်ဒါတင်မည်</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let selectedItemName = "";
        let selectedItemPrice = "";

        function selectItem(name, price) {
            selectedItemName = name;
            selectedItemPrice = price;
            document.getElementById('shop-section').style.display = 'none';
            document.getElementById('checkout-section').style.display = 'block';
            document.getElementById('selected-item-title').innerText = "📦 " + name;
            document.getElementById('item-price').innerText = price;
            document.getElementById('status-msg').innerText = '';
        }

        function goBack() {
            document.getElementById('shop-section').style.display = 'block';
            document.getElementById('checkout-section').style.display = 'none';
            document.getElementById('status-msg').innerText = '';
        }

        function showFileName() {
            const fileInput = document.getElementById('slip-file');
            const fileNameDiv = document.getElementById('selected-file-name');
            if (fileInput.files.length > 0) {
                fileNameDiv.innerText = "📄 ရွေးချယ်ထားသော ပုံ: " + fileInput.files[0].name;
                fileNameDiv.style.color = "#4ade80";
            }
        }

        async function sendOrderToBot() {
            const userIdInput = document.getElementById('mlbb-id').value.trim();
            const zoneIdInput = document.getElementById('mlbb-zone').value.trim();
            const fileInput = document.getElementById('slip-file');
            const statusMsg = document.getElementById('status-msg');

            if (!userIdInput || !zoneIdInput) {
                alert("ကျေးဇူးပြု၍ MLBB User ID နှင့် Zone ID ကို မှန်ကန်စွာ ဖြည့်ပေးပါ!");
                return;
            }

            if (fileInput.files.length === 0) {
                alert("ကျေးဇူးပြု၍ ငွေလွှစလစ် ဓာတ်ပုံ အရင် ရွေးချယ်ပေးပါ!");
                return;
            }

            statusMsg.style.color = "#38bdf8";
            statusMsg.innerText = "⏳ အော်ဒါ တင်နေပါသည်... ခဏစောင့်ပါ";

        const formData = new FormData();
            formData.append('photo', fileInput.files[0]);
            formData.append('item_name', selectedItemName);
            formData.append('price', selectedItemPrice);
            formData.append('mlbb_id', userIdInput);
            formData.append('mlbb_zone', zoneIdInput);

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                formData.append('user_id', tg.initDataUnsafe.user.id);
                formData.append('username', tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
            } else {
                formData.append('user_id', 'Unknown');
                formData.append('username', 'Guest');
            }

            try {
                const response = await fetch('https://JockerLinn.pythonanywhere.com/upload_slip', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    statusMsg.style.color = "#4ade80";
                    statusMsg.innerText = "✅ အော်ဒါ အောင်မြင်စွာ တင်ပြီးပါပြီ!";
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 1500);
                } else {
                    statusMsg.style.color = "#f87171";
                    statusMsg.innerText = "❌ အော်ဒါ တင်၍ မရပါ။ " + (result.error || "");
                }
            } catch (error) {
                console.error(error);
                statusMsg.style.color = "#f87171";
                statusMsg.innerText = "⚠️ Server သို ချိတ်ဆက်၍ မရပါ။";
            }
        }
    </script>
</body>
</html>
