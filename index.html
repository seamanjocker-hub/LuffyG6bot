<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; margin: 0; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #2481cc; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🛍️ Online Shop Catalog</h2>
    
    <div class="card">
        <div>
            <strong>Shirt A</strong><br>
            <span>15,000 MMK</span>
        </div>
        <button class="btn" onclick="buyItem('Shirt A', '15,000 MMK')">ဝယ်မည်</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function buyItem(itemName, price) {
            const data = { item: itemName, price: price };
            tg.sendData(JSON.stringify(data)); 
            tg.close();
        }
    </script>
</body>
</html>
